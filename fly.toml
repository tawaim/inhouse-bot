# Fly.io config — fill in app name with `fly launch` or edit before first deploy.
app = "inhouse-league-bot"
primary_region = "atl"   # Atlanta — closest to user. Use `fly platform regions` to see all.

[build]

[env]
  TZ = "America/New_York"

# Persistent volume for SQLite
[[mounts]]
  source = "inhouse_data"
  destination = "/data"

# Bot is outbound-only — no public HTTP, no services block.
# Fly will keep the process running via the VM's machine state.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
