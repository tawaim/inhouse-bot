# fly.toml app configuration file for inhouse-league-bot
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'inhouse-league-bot'
primary_region = 'dfw'

[build]

[env]
  TZ = 'America/New_York'

[[mounts]]
  source = 'inhouse_data'
  destination = '/data'

# This is a worker-only app (Discord bot, outbound WebSocket).
# No HTTP service. Machine should stay running 24/7.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1